ms_node:
  ros__parameters:
    # Device polling rate (Hz) — how often to read VR/mocap device frame
    device_poll_rate_hz: 60.0

    # State broadcast rates (Hz)
    teleop_state_rate_hz: 10.0
    device_state_rate_hz: 10.0
    heartbeat_rate_hz: 1.0

    # Tracking quality threshold [0.0, 1.0] — below this, frames are dropped
    tracking_quality_threshold: 0.5

    # Max consecutive dropped frames before entering ERROR state
    max_dropped_frames: 30
