      - "agent_node"
      - "hds_node"
      - "gateway_node"
      - "dr_node"
      - "perception_node"
      - "vslam_node"
      - "lidar_slam_node"
      - "mapmanager_node"
      - "fota_node"
      - "setting_node"
      - "rc_node"
